version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cat_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cat_management
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cat_network

  backend:
    build: .
    container_name: cat_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cat_management
      PORT: 8080
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cat_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  cat_network:
    driver: bridge
