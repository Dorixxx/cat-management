<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 猫咪管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app">
        <nav class="sidebar">
            <div class="logo">
                <span class="logo-icon">🐱</span>
                <span class="logo-text">猫咪管家</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-page="cats" onclick="switchPage('cats')">
                    <span class="nav-icon">🐈</span>
                    <span>猫咪档案</span>
                </li>
                <li class="nav-item" data-page="tasks" onclick="switchPage('tasks')">
                    <span class="nav-icon">⏰</span>
                    <span>任务提醒</span>
                </li>
                <li class="nav-item" data-page="inventory" onclick="switchPage('inventory')">
                    <span class="nav-icon">📦</span>
                    <span>库存管理</span>
                </li>
                <li class="nav-item" data-page="expenses" onclick="switchPage('expenses')">
                    <span class="nav-icon">💰</span>
                    <span>花费统计</span>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <h1 id="page-title">猫咪档案</h1>
                <div class="top-actions">
                    <button class="btn btn-primary" id="btn-add" onclick="onAddClick()">+ 新增</button>
                </div>
            </header>

            <div class="content" id="content-area">
                <!-- 内容由 JS 动态渲染 -->
            </div>
        </main>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">标题</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" id="modal-confirm" onclick="onModalConfirm()">确认</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script src="/js/app.js"></script>
</body>
</html>
