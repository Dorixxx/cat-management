server {
    listen 80;
    server_name _;  # 替换为你的域名，如 cat.yourdomain.com

    # 日志
    access_log /var/log/nginx/cat-management.access.log;
    error_log /var/log/nginx/cat-management.error.log;

    # 前端静态文件（可选：如果 Nginx 直接托管静态文件）
    # location /css/ {
    #     alias /opt/cat-management/backend/app/static/css/;
    #     expires 30d;
    # }
    # location /js/ {
    #     alias /opt/cat-management/backend/app/static/js/;
    #     expires 30d;
    # }

    # 反向代理到后端
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
